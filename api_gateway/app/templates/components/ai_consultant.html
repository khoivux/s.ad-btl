<!-- AI Consultant Widget -->
<style>
    #ai-chat-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        font-family: 'Inter', sans-serif;
    }

    #chat-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #chat-circle:hover {
        transform: scale(1.1);
    }

    #chat-box {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 480px;
        height: 680px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #eef2f6;
    }

    #chat-box.active {
        display: flex;
    }

    #chat-header {
        background: #6366f1;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .message {
        max-width: 85%;
        padding: 10px 15px;
        border-radius: 15px;
        font-size: 1rem;
        line-height: 1.5;
        white-space: pre-wrap;
        /* Preserve newlines */
    }

    .message.user {
        background: #6366f1;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }

    .message.assistant {
        background: white;
        color: #334155;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .message.assistant a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .message.assistant a:hover {
        color: #4f46e5;
    }

    #chat-input-area {
        padding: 15px;
        border-top: 1px solid #eef2f6;
        display: flex;
        gap: 10px;
    }

    #chat-input-area input {
        flex: 1;
        border: 1px solid #e2e8f0;
        padding: 8px 12px;
        border-radius: 20px;
        outline: none;
    }

    #chat-input-area button {
        background: #6366f1;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
    }

    .typing-skeleton {
        display: none;
        background: white;
        padding: 10px 15px;
        border-radius: 15px;
        align-self: flex-start;
        font-size: 0.8rem;
        color: #94a3b8;
    }

    /* Responsive styling for mobile screens */
    @media (max-width: 540px) {
        #chat-box {
            width: calc(100vw - 40px) !important;
            height: calc(100vh - 120px) !important;
            bottom: 80px !important;
            right: 0 !important;
        }
    }
</style>

<!-- Load FontAwesome if missing -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div id="ai-chat-widget">
    <div id="chat-circle">
        <!-- AI Robot Icon with subtle animation -->
        <i class="fas fa-robot fa-2x" style="color: white; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));"></i>
    </div>

    <div id="chat-box">
        <div id="chat-header">
            <div>
                <i class="fas fa-robot mr-2"></i>
                <strong>AI Consultant</strong>
            </div>
            <i class="fas fa-times cursor-pointer" id="close-chat"></i>
        </div>

        <div id="chat-messages">
            <div class="message assistant">Chào bạn! Tôi là chuyên gia tư vấn sản phẩm của MicroStore. Tôi có thể giúp gì cho bạn?</div>
            <div id="typing-indicator" class="typing-skeleton">Chờ tôi một chút...</div>
        </div>

        <form id="chat-form">
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Hỏi tôi đi..." autocomplete="off">
                <button type="submit">Gửi</button>
            </div>
        </form>
    </div>
</div>

<!-- Product Preview Tooltip -->
<div id="product-tooltip" style="display: none; position: fixed; z-index: 10000; pointer-events: none;" class="w-80 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-2xl p-4 flex gap-3 transition-all duration-200 opacity-0 transform translate-y-2">
    <div class="w-20 h-20 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0 border border-slate-200">
        <img id="tooltip-image" src="" alt="" class="w-full h-full object-cover">
    </div>
    <div class="flex-1 flex flex-col min-w-0">
        <span id="tooltip-category" class="inline-block self-start px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-wider rounded mb-1">Category</span>
        <h4 id="tooltip-name" class="text-sm font-bold text-slate-800 leading-snug truncate">Product Name</h4>
        <p id="tooltip-description" class="text-[11px] text-slate-500 line-clamp-2 mt-0.5">Description...</p>
        <div class="mt-auto flex items-baseline gap-1">
            <span class="text-xs text-slate-400 font-medium">Price:</span>
            <span id="tooltip-price" class="text-sm font-black text-indigo-600">$0.00</span>
        </div>
    </div>
</div>

<script>
    const chatCircle = document.getElementById('chat-circle');
    const chatBox = document.getElementById('chat-box');
    const closeChat = document.getElementById('close-chat');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');

    // Toggle Chat Box
    chatCircle.addEventListener('click', () => {
        chatBox.classList.add('active');
        loadHistory();
    });

    closeChat.addEventListener('click', () => {
        chatBox.classList.remove('active');
    });

    // Load History
    async function loadHistory() {
        try {
            const res = await fetch('/api/chat/history/');
            if (res.ok) {
                const history = await res.json();
                if (history.length > 0) {
                    // Only remove .message divs, keep typing-indicator
                    const messages = chatMessages.querySelectorAll('.message');
                    messages.forEach(m => m.remove());

                    history.forEach(msg => {
                        appendMessage(msg.role, msg.content);
                    });
                }
            }
        } catch (err) {
            console.error("Failed to load history", err);
        }
    }

    function appendMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        updateMessageContent(div, content);

        if (typingIndicator && chatMessages.contains(typingIndicator)) {
            chatMessages.insertBefore(div, typingIndicator);
        } else {
            chatMessages.appendChild(div);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    function updateMessageContent(div, content) {
        // Escape HTML to prevent XSS
        let htmlContent = content.replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));

        // Basic Markdown Parser (Bold)
        htmlContent = htmlContent.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

        // Basic Markdown Parser (Links: [text](url)) - Opens in new tab
        // Enhanced: Match /products/(\d+)/ to inject data-product-id and product-link class
        htmlContent = htmlContent.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, text, url) => {
            const m = url.match(/\/products\/(\d+)\/?/);
            if (m) {
                return `<a href="${url}" target="_blank" class="product-link" data-product-id="${m[1]}">${text}</a>`;
            }
            return `<a href="${url}" target="_blank">${text}</a>`;
        });

        div.innerHTML = htmlContent;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = chatInput.value.trim();
        if (!msg) return;

        appendMessage('user', msg);
        chatInput.value = '';

        typingIndicator.style.display = 'block';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch('/api/chat/consultant/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });

            if (!response.ok) throw new Error("AI Service Unavailable");

            // Prepare empty assistant message for streaming
            typingIndicator.style.display = 'none';
            const assistantDiv = appendMessage('assistant', '');
            let fullText = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;
                updateMessageContent(assistantDiv, fullText);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        } catch (err) {
            typingIndicator.style.display = 'none';
            appendMessage('assistant', "Rất tiếc, tôi đang gặp lỗi kết nối dòng dữ liệu.");
            console.error("Stream failed", err);
        }
    });

    // Tooltip Hover Logic
    const tooltip = document.getElementById('product-tooltip');
    const tooltipImg = document.getElementById('tooltip-image');
    const tooltipCat = document.getElementById('tooltip-category');
    const tooltipName = document.getElementById('tooltip-name');
    const tooltipDesc = document.getElementById('tooltip-description');
    const tooltipPrice = document.getElementById('tooltip-price');

    const productCache = {};
    let hoverTimeout = null;

    chatMessages.addEventListener('mouseover', async (e) => {
        const link = e.target.closest('.product-link');
        if (!link) return;

        const productId = link.getAttribute('data-product-id');
        if (!productId) return;

        if (hoverTimeout) clearTimeout(hoverTimeout);

        const rect = link.getBoundingClientRect();
        
        // Show tooltip loading state
        tooltipImg.src = '';
        tooltipCat.textContent = 'Loading...';
        tooltipName.textContent = 'Đang tải thông tin...';
        tooltipDesc.textContent = '';
        tooltipPrice.textContent = '';
        
        tooltip.style.display = 'flex';
        tooltip.style.left = `${rect.left}px`;
        tooltip.style.top = `${rect.top - 120}px`;
        
        void tooltip.offsetWidth; // trigger reflow
        tooltip.classList.remove('opacity-0', 'translate-y-2');
        tooltip.classList.add('opacity-100', 'translate-y-0');

        try {
            let pData = productCache[productId];
            if (!pData) {
                const res = await fetch(`/api/products/${productId}/preview/`);
                if (res.ok) {
                    pData = await res.json();
                    productCache[productId] = pData;
                }
            }

            if (pData && e.target.closest('.product-link') === link) {
                tooltipImg.src = pData.image_url || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=100';
                tooltipCat.textContent = pData.category_name || 'Product';
                tooltipName.textContent = pData.name;
                tooltipDesc.textContent = pData.description || 'Chưa có mô tả chi tiết cho sản phẩm này.';
                tooltipPrice.textContent = `$${pData.price}`;
                
                const tRect = tooltip.getBoundingClientRect();
                tooltip.style.top = `${rect.top - tRect.height - 10}px`;
                
                let left = rect.left + (rect.width - tRect.width) / 2;
                if (left < 10) left = 10;
                if (left + tRect.width > window.innerWidth - 10) {
                    left = window.innerWidth - tRect.width - 10;
                }
                tooltip.style.left = `${left}px`;
            }
        } catch (err) {
            console.error("Preview load failed", err);
        }
    });

    chatMessages.addEventListener('mouseout', (e) => {
        const link = e.target.closest('.product-link');
        if (!link) return;

        if (hoverTimeout) clearTimeout(hoverTimeout);
        hoverTimeout = setTimeout(() => {
            tooltip.classList.remove('opacity-100', 'translate-y-0');
            tooltip.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => {
                if (tooltip.classList.contains('opacity-0')) {
                    tooltip.style.display = 'none';
                }
            }, 200);
        }, 150);
    });
</script>
